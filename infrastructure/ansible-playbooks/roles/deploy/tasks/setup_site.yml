---
- name: Create project directory for {{ item.name }}
  file:
    path: "{{ item.root }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: www-data
    mode: 0775

- name: Set ACL for deploy user on {{ item.name }}
  acl:
    path: "{{ item.root }}"
    entity: "{{ deploy_user }}"
    etype: user
    permissions: rwX
    recursive: yes
    state: present

- name: Set ACL for www-data on {{ item.name }}
  acl:
    path: "{{ item.root }}"
    entity: www-data
    etype: user
    permissions: rwX
    recursive: yes
    state: present

- name: Create shared directories for {{ item.name }}
  file:
    path: "{{ item.root }}/{{ subitem }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: www-data
    mode: 0775
  loop:
    - storage
    - storage/app
    - storage/framework
    - storage/framework/cache
    - storage/framework/sessions
    - storage/framework/views
    - storage/logs
    - bootstrap/cache
  loop_control:
    loop_var: subitem

- name: Create .env file for {{ item.name }}
  template:
    src: env.j2
    dest: "{{ item.root }}/.env"
    owner: "{{ deploy_user }}"
    group: www-data
    mode: '0660'

- name: Install supervisor queue worker config for {{ item.name }}
  template:
    src: supervisor-queue.conf.j2
    dest: "/etc/supervisor/conf.d/{{ item.name }}-queue.conf"
    owner: root
    group: root
    mode: '0644'

- name: Supervisor reread
  command: supervisorctl reread
  register: supervisor_reread
  changed_when: "'No config updates' not in supervisor_reread.stdout"

- name: Supervisor update
  command: supervisorctl update

- name: Ensure {{ item.name }}-queue is running
  command: "supervisorctl start {{ item.name }}-queue:*"
  register: supervisor_start
  failed_when:
    - supervisor_start.rc != 0
    - "'already started' not in supervisor_start.stderr"
    - "'already started' not in supervisor_start.stdout"

- name: Install cron for Laravel scheduler ({{ item.name }})
  cron:
    name: "Laravel scheduler for {{ item.name }}"
    user: www-data
    minute: "*"
    job: "cd {{ item.root }} && /usr/bin/php artisan schedule:run >> /dev/null 2>&1"
